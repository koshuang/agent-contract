name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test CLI
        run: node --test packages/cli/test/*.test.mjs
      - name: Check reference integration
        run: node packages/cli/src/index.mjs check --root examples/minimal
